name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Node line: 22 and 24 are LTS, 26 is Current.
        # Node 20 is deliberately absent — it reached end-of-life in March 2026.
        node: ['22', '24', '26']
        os: [ubuntu-latest]
        include:
          # The tool reads paths and timestamps, so prove it on other platforms too.
          - { node: '24', os: macos-latest }
          - { node: '24', os: windows-latest }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  release-notes:
    # 0.1.3 was bumped in one commit and never tagged, so it reached neither npm
    # nor the CHANGELOG and nobody noticed for months. The version in
    # package.json must always have notes ready, whether or not a tag follows —
    # the release workflow checks this too, but only once the tag is pushed,
    # which is far too late to be useful.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: CHANGELOG has notes for the version in package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if ! node scripts/release-notes.mjs "$PKG" >/dev/null; then
            echo "::error::package.json is at $PKG but CHANGELOG.md has no \"## [$PKG]\" section. Write the notes in the same change that bumps the version."
            exit 1
          fi
          echo "$PKG has release notes."

  timezones:
    # Day boundaries are computed in local time; a UTC-only CI would hide bugs
    # that only appear for users east or west of Greenwich.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: ['UTC', 'America/Los_Angeles', 'Pacific/Auckland', 'Asia/Kolkata', 'Pacific/Kiritimati']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}

  ci-ok:
    # The single check to require in branch protection.
    #
    # `test` and `timezones` are matrix jobs, so they report as "test (22,
    # ubuntu-latest)" and so on — a rule requiring the bare name waits forever
    # for a check that never arrives. Naming all ten instead would then have to
    # be edited by hand every time a Node version or a timezone is added, and a
    # forgotten edit silently stops enforcing the new one. This job depends on
    # them all and is the only name protection needs to know.
    if: always()
    needs: [test, release-notes, timezones]
    runs-on: ubuntu-latest
    steps:
      # `needs` alone is not enough: a job whose dependency failed is *skipped*,
      # and a skipped required check can count as satisfied. Assert the results.
      - name: Every prerequisite job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A prerequisite job did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "test, release-notes and timezones all succeeded."
